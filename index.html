<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="アウトドア・エンデュランス競技（トレイルランニング、アドベンチャーレース、サイクリング、マラソン）の大会情報集約ダッシュボード＆楽天連動特価ギア速報ポータル" />
    <title>OUTDOOR RACE HUB | アウトドア・エンデュランス大会＆特価ギア速報</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google Analytics (GA4) 管理者専用アクセス解析タグ -->
    <!-- ※管理者の測定ID（G-XXXXXXXXXX）を設定すると、裏側で詳細なアクセス分析（日別PV、訪問地域、クリック統計等）が有効になります -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-OUTDOORHUB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // デフォルト設定（IDが差し替えられた際に自動トラッキング開始）
      gtag('config', 'G-OUTDOORHUB', { send_page_view: true });
    </script>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('race_hub_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 min-h-screen selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:bg-emerald-500/30 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
