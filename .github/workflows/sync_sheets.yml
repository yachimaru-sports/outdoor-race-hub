name: Sync Events from Google Sheets & Deploy

on:
  schedule:
    # 毎日 朝8:00 / 昼12:00 / 夜20:00 (JST)
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch: # GitHub画面から「Run workflow」ボタンでいつでも手動即時同期可能

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-sync'
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Events from Google Sheets
        env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: node scripts/sync_from_sheets.mjs

      - name: Check Duplicates
        run: npm run check:duplicates

      - name: Commit & Push Changes
        run: |
          git config user.name "sheets-sync-bot"
          git config user.email "sheets-sync-bot@users.noreply.github.com"
          git add src/data/events.json outdoor_race_hub_events_master.csv
          if ! git diff --staged --quiet; then
            git commit -m "chore(sheets): Googleスプレッドシートからの最新大会データ自動同期"
            git push origin main
          else
            echo "スプレッドシートに変更なし（デプロイへ進みます）"
          fi

      - name: Build SPA
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
