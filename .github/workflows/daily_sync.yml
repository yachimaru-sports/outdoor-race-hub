name: "Daily Auto Sync & Update (Every Morning 8:00 JST)"

on:
  schedule:
    # 毎朝 08:00 JST 前後に確実に完了するよう 07:50 JST（UTC 22:50）に定期自動実行（毎時00分の遅延回避）
    - cron: '50 22 * * *'
  workflow_dispatch:
    inputs:
      update_trend:
        description: '【手動オプション】週次トレンド＆季節カタログ更新を今すぐ実行する'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  daily-sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "Install Python & Node Dependencies"
        run: |
          pip install -r requirements.txt
          npm ci

      - name: "Step 1: 装備カタログ更新（商品ページ実測・画像/価格/割引率を実データで確定）"
        id: gears
        continue-on-error: true
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/refresh_gears.mjs

      - name: "Step 2: 大会データ同期・正規化（Python / スプレッドシート連携 / Gemini AI）"
        env:
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/sync_hub.py

      - name: "Step 3: 大会リンク自動修復（死リンクはAI再探索→不可なら非表示）"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/auto_heal_event_links.mjs

      - name: "Step 4: 公開前ゲート＆自己修復（重複ゼロ・装備の全リンク/画像/割引率の検証＆AI自動修復）"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run check:duplicates
          node scripts/validate_site_data.mjs

      - name: "Step 5: ビルド（型チェック込み）"
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: "Step 6: 検証済みデータをコミット＆プッシュ"
        run: |
          git config user.name "outdoor-race-hub-bot"
          git config user.email "bot@outdoor-race-hub.local"
          git add src/data/events.json src/data/deals.json src/data/gears.json src/data/meta.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): 毎朝8時定期同期（装備は商品ページ実測・大会リンクはHTTP検証済み）"
            git pull --rebase origin main
            git push origin main
          else
            echo "データ変更なし（差分なしのためプッシュをスキップします）"
          fi
      - name: "Step 7: Setup Pages"
        uses: actions/configure-pages@v4

      - name: "Step 8: Upload Artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: "Step 9: Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4

      - name: "Step 10: 装備更新が失敗していた場合は実行を失敗扱いにして通知（サイトは前日の正常データで公開済み）"
        if: ${{ steps.gears.outcome == 'failure' }}
        run: |
          echo "::error::装備カタログの自動更新が検証に失敗しました。前日の正常データで公開を継続しています。Step 1 のログを確認してください。"
          exit 1