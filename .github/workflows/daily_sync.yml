name: "Daily Auto Sync & Update (Every Morning 8:00 JST)"

on:
  schedule:
    # 本番: 07:50 JST（UTC 22:50）。毎時00分の混雑を避けて 8:00 前後の完了を狙う
    - cron: '50 22 * * *'
    # 予備1: 08:40 JST（UTC 23:40）… 本番が GitHub 側で起動されなかった／失敗した場合の自動再実行
    - cron: '40 23 * * *'
    # 予備2: 10:15 JST（UTC 01:15）… 最終リトライ
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      update_trend:
        description: '【手動オプション】週次トレンド＆季節カタログ更新を今すぐ実行する'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 予備スケジュールで起動した場合、本日（JST）すでに成功していれば何もしない（二重更新・API浪費の防止）
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: "本日分が成功済みかを確認"
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手動実行のため必ず実行します"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY_JST=$(TZ=Asia/Tokyo date +%F)
          START_UTC=$(date -u -d "${TODAY_JST} 00:00 +0900" +%FT%TZ)
          COUNT=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily_sync.yml \
                    --status success --created ">=${START_UTC}" --json databaseId --jq 'length' || echo 0)
          echo "本日(${TODAY_JST} JST)の成功済み実行数: ${COUNT}"
          if [ "${COUNT}" -gt 0 ]; then
            echo "本日分は更新済みのためスキップします"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  daily-sync-and-deploy:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1_exec.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "Install Python & Node Dependencies"
        run: |
          pip install -r requirements.txt
          npm ci

      - name: "Step 1: 装備カタログ・お得情報更新（商品ページ実測・新規特価探索＆入替）"
        id: gears
        continue-on-error: true
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/refresh_gears.mjs

      - name: "Step 1-R: 装備更新失敗時は前日の正常データに戻す"
        if: ${{ steps.gears.outcome == 'failure' }}
        run: git checkout -- src/data/gears.json src/data/deals.json src/data/meta.json

      - name: "Step 2: 大会データ自動更新（終了アーカイブ・次回調査・新着大会追加・リンク内容照合＆修復）"
        id: events
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update_events.mjs

      - name: "Step 2-R: 大会更新失敗時は前日の正常データに戻す"
        if: ${{ steps.events.outcome == 'failure' }}
        run: git checkout -- src/data/events.json src/data/events_archive.json src/data/changelog.json

      - name: "Step 3: Googleスプレッドシート＆マスターCSV同期（失敗してもサイト更新は継続）"
        id: sheets
        continue-on-error: true
        env:
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/sync_hub.py

      - name: "Step 4: 公開前ゲート＆自己修復（重複ゼロ・装備の全リンク/画像/割引率の検証＆AI自動修復）"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run check:duplicates
          node scripts/validate_site_data.mjs

      - name: "Step 5: ビルド（事前監査・型チェック・SEO静的ページ生成込み）"
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: "Step 6: 検証済みデータをコミット＆プッシュ（失敗しても公開は継続）"
        id: push
        continue-on-error: true
        run: |
          git config user.name "outdoor-race-hub-bot"
          git config user.email "bot@outdoor-race-hub.local"
          # Git管理下のデータファイルだけを追加（.gitignore 対象の CSV 等を指定すると exit 1 で停止するため）
          for f in src/data/events.json src/data/events_archive.json src/data/deals.json src/data/gears.json src/data/meta.json src/data/changelog.json; do
            if [ -f "$f" ] && ! git check-ignore -q "$f"; then git add -- "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "データ変更なし（差分なしのためプッシュをスキップします）"
            exit 0
          fi
          git commit -m "chore(auto): 毎朝8時定期同期（装備は商品ページ実測・大会リンクはHTTP検証済み）"
          # 他のコミットと競合した場合に備えて最大3回リトライ
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "プッシュ成功（${i}回目）"
              exit 0
            fi
            echo "プッシュ失敗（${i}回目）。10秒後に再試行します"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      - name: "Step 7: Setup Pages"
        uses: actions/configure-pages@v6

      - name: "Step 8: Upload Artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: "Step 8.5: アーティファクト反映待機（Found 0 artifact(s) 防止）"
        run: sleep 10

      - name: "Step 9: Deploy to GitHub Pages (Attempt 1)"
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: "Step 9-Retry1: 15秒待機後に再デプロイ"
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        run: sleep 15
      - name: "Step 9-Retry1: Execute Deploy"
        id: deployment_retry1_exec
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: "Step 9-Retry2: 30秒待機後に最終再デプロイ"
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1_exec.outcome == 'failure'
        run: sleep 30
      - name: "Step 9-Retry2: Execute Deploy"
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1_exec.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: "Step 10: エラー診断サマリー出力＆一部失敗時の再試行通知"
        if: ${{ failure() || steps.gears.outcome == 'failure' || steps.events.outcome == 'failure' || steps.sheets.outcome == 'failure' || steps.push.outcome == 'failure' }}
        run: |
          {
            echo "## ⚠️ 毎朝自動同期・更新ワークフロー診断レポート"
            echo ""
            echo "| ステップ | 結果 |"
            echo "| :--- | :--- |"
            echo "| Step 1: 装備カタログ更新 | \`${{ steps.gears.outcome }}\` |"
            echo "| Step 2: 大会データ更新 | \`${{ steps.events.outcome }}\` |"
            echo "| Step 3: スプレッドシート同期 | \`${{ steps.sheets.outcome }}\` |"
            echo "| Step 6: Gitコミット＆プッシュ | \`${{ steps.push.outcome }}\` |"
            echo "| Step 9: Pagesデプロイ (1回目) | \`${{ steps.deployment.outcome }}\` |"
            echo "| Step 9: Pagesデプロイ (2回目) | \`${{ steps.deployment_retry1_exec.outcome }}\` |"
            echo "| Step 9: Pagesデプロイ (3回目) | \`${{ steps.deployment_retry2.outcome }}\` |"
            echo ""
            echo "### エラー対応プロセス"
            echo "- Step 1〜3・6 のみの失敗時は、公開サイト自体は前日正常データで保護されています（予備スケジュールで自動再実行されます）。"
            echo "- Step 9（Pagesデプロイ）が 3 回とも失敗した場合は、\`docs/ERROR_RECOVERY.md\` の手順に従って手動再実行または状況確認を行ってください。"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.gears.outcome }}" = "failure" ]  && echo "::error::Step 1 装備カタログ更新が失敗しました（前日データで公開）"
          [ "${{ steps.events.outcome }}" = "failure" ] && echo "::error::Step 2 大会データ更新が失敗しました（前日データで公開）"
          [ "${{ steps.sheets.outcome }}" = "failure" ] && echo "::error::Step 3 スプレッドシート同期が失敗しました"
          [ "${{ steps.push.outcome }}" = "failure" ]   && echo "::error::Step 6 データのプッシュが失敗しました（サイトは最新データで公開済み）"
          echo "失敗ステップがあるため、予備スケジュールで自動再実行されます"
          exit 1
